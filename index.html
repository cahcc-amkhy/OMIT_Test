                                <div class="flex space-x-2">
                                    <button 
                                        onClick={() => setTimerActive(!timerActive)}
                                        class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-black py-3 rounded-xl text-sm"
                                    >
                                        {timerActive ? '⏸️ 暫停' : '▶️ 開始'}
                                    </button>
                                    <button 
                                        onClick={() => { setTimerSeconds(0); setTimerActive(false); }}
                                        class="px-4 bg-slate-200 text-slate-700 font-bold rounded-xl text-sm"
                                    >
                                        重置
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Item 2 & 7: Student Answer Inspection Modal */}
                    {showInspectModal && (
                        <div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-2xl w-full space-y-4 shadow-2xl relative">
                                <button onClick={() => setShowInspectModal(null)} class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
                                <div class="flex justify-between items-center border-b pb-2">
                                    <h3 class="text-lg font-black text-slate-800">
                                        作品詳情：{currentResponseArray[inspectIndex]?.seatNumber}號 {currentResponseArray[inspectIndex]?.name}
                                    </h3>
                                    <span class="text-xs font-mono font-bold text-slate-400">
                                        {inspectIndex + 1} / {currentResponseArray.length}
                                    </span>
                                </div>

                                <div class="py-4 space-y-3">
                                    {typeof currentResponseArray[inspectIndex]?.answer === 'string' && currentResponseArray[inspectIndex]?.answer.startsWith('data:image') ? (
                                        <div class="border-2 rounded-2xl overflow-hidden bg-slate-50 aspect-16-9">
                                            <img src={currentResponseArray[inspectIndex]?.answer} class="w-full h-full object-contain" alt="作品" />
                                        </div>
                                    ) : (
                                        <div class="bg-indigo-50 p-6 rounded-2xl text-xl font-bold text-slate-800 text-center">
                                            {currentResponseArray[inspectIndex]?.answer}
                                        </div>
                                    )}
                                </div>

                                <div class="flex justify-between items-center border-t pt-3">
                                    <div class="flex space-x-2">
                                        <button 
                                            disabled={inspectIndex <= 0}
                                            onClick={() => {
                                                const next = inspectIndex - 1;
                                                setInspectIndex(next);
                                                setShowInspectModal(currentResponseArray[next]);
                                            }}
                                            class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs disabled:opacity-40"
                                        >
                                            ⬅️ 上一位
                                        </button>
                                        <button 
                                            disabled={inspectIndex >= currentResponseArray.length - 1}
                                            onClick={() => {
                                                const next = inspectIndex + 1;
                                                setInspectIndex(next);
                                                setShowInspectModal(currentResponseArray[next]);
                                            }}
                                            class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs disabled:opacity-40"
                                        >
                                            下一位 ➡️
                                        </button>
                                    </div>

                                    <button 
                                        onClick={() => handleBroadcastStudentAnswer(currentResponseArray[inspectIndex])}
                                        class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow"
                                    >
                                        📢 一鍵廣播至全班螢幕
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StudentInterface({ roomCode, studentName, seatNumber, studentId, activeQuestion, responses, showToast, onExit }) {
            const [myAnswer, setMyAnswer] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [submitTime, setSubmitTime] = useState(null);

            // Canvas states
            const [strokeWidth, setStrokeWidth] = useState(4);
            const [isEraser, setIsEraser] = useState(false);
            const [currentColor, setCurrentColor] = useState('#2563eb');
            const [studentBg, setStudentBg] = useState(null);

            // Item 5: Audio Recording States
            const [isRecording, setIsRecording] = useState(false);
            const [audioBlobUrl, setAudioBlobUrl] = useState(null);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);

            // Item 19: Challenge Mode Answers
            const [challengeAnswers, setChallengeAnswers] = useState({});
            const [challengeRemainingTime, setChallengeRemainingTime] = useState(null);

            // Item 22.3.4: Collaborative Team Mode States
            const [teamAnswers, setTeamAnswers] = useState({});

            const currentResponseKey = `${activeQuestion?.id}_${studentId}`;
            const myPrevResponse = responses[currentResponseKey];

            // Reset local states on question change
            useEffect(() => {
                if (myPrevResponse) {
                    setSubmitted(true);
                    setMyAnswer(myPrevResponse.answer);
                } else {
                    setSubmitted(false);
                    setMyAnswer('');
                    setAudioBlobUrl(null);
                    setChallengeAnswers({});
                }
            }, [activeQuestion?.id, myPrevResponse]);

            // Item 13 & 19: Challenge Timer countdown in student view
            useEffect(() => {
                let interval = null;
                if (activeQuestion?.mode === 'CHALLENGE' && activeQuestion.challenge?.timeLimit && !submitted) {
                    const elapsed = Math.floor((Date.now() - activeQuestion.startTime) / 1000);
                    const remain = Math.max(0, activeQuestion.challenge.timeLimit - elapsed);
                    setChallengeRemainingTime(remain);

                    interval = setInterval(() => {
                        setChallengeRemainingTime(r => {
                            if (r <= 1) {
                                handleAutoSubmitChallenge();
                                return 0;
                            }
                            return r - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [activeQuestion, submitted]);

            const submitResponseToFirestore = async (ansVal, extraObj = {}) => {
                const duration = Math.max(1, Math.round((Date.now() - activeQuestion.startTime) / 1000));
                const resObj = {
                    questionId: activeQuestion.id,
                    studentId: studentId,
                    seatNumber: seatNumber,
                    name: studentName || `學號 ${seatNumber}`,
                    answer: ansVal,
                    duration: duration,
                    submittedAt: Date.now(),
                    ...extraObj
                };

                const appId = "omit-8c173";
                const db = window.fbDb;
                const docRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses', `${activeQuestion.id}_${studentId}`);
                await window.fbUtils.setDoc(docRef, resObj);

                setSubmitted(true);
                setSubmitTime(duration);
            };

            const handleAutoSubmitChallenge = () => {
                if (submitted || !activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                
                let score = 0;
                const totalQs = activeQuestion.challenge.questions.length;

                activeQuestion.challenge.questions.forEach((q, idx) => {
                    if (challengeAnswers[idx] === q.answer) {
                        score += (activeQuestion.challenge.totalScore / totalQs);
                    }
                });

                const scoreDetails = {
                    totalScore: Math.round(score),
                    percentage: Math.round((score / activeQuestion.challenge.totalScore) * 100),
                    answers: challengeAnswers
                };

                submitResponseToFirestore('已完成挑戰題 (時間結束自動提交)', { scoreDetails });
                showToast("時間結束，考卷已自動提交！", "info");
            };

            const handleManualSubmitChallenge = () => {
                let score = 0;
                const totalQs = activeQuestion.challenge.questions.length;

                activeQuestion.challenge.questions.forEach((q, idx) => {
                    if (challengeAnswers[idx] === q.answer) {
                        score += (activeQuestion.challenge.totalScore / totalQs);
                    }
                });

                const scoreDetails = {
                    totalScore: Math.round(score),
                    percentage: Math.round((score / activeQuestion.challenge.totalScore) * 100),
                    answers: challengeAnswers
                };

                submitResponseToFirestore('已完成挑戰題', { scoreDetails });
            };

            // Audio recorder helpers
            const startAudioRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => setAudioBlobUrl(reader.result);
                        reader.readAsDataURL(blob);
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                } catch (err) {
                    showToast("無法存取麥克風設備！", "error");
                }
            };

            const stopAudioRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            // Item 22.3.4: Team question answer submission
            const myTeam = useMemo(() => {
                if (!activeQuestion || activeQuestion.mode !== 'TEAM') return null;
                return activeQuestion.teamsList?.find(t => t.members.some(m => m.id === studentId));
            }, [activeQuestion, studentId]);

            const handleTeamAnswerClick = async (choiceLetter) => {
                if (!myTeam || !activeQuestion || activeQuestion.teamStage !== 'COMPETITION') return;

                const currentQIdx = myTeam.progress;
                const qObj = activeQuestion.teamData.questions[currentQIdx];

                const isCorrect = choiceLetter === qObj.answer;
                
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                const newTeamsList = activeQuestion.teamsList.map(t => {
                    if (t.id === myTeam.id) {
                        const newProg = isCorrect ? t.progress + 1 : 0; // Wrong answer resets back to start
                        return { ...t, progress: newProg };
                    }
                    return t;
                });

                let winner = activeQuestion.winningTeam;
                const updatedTeam = newTeamsList.find(t => t.id === myTeam.id);
                if (updatedTeam.progress >= activeQuestion.teamData.questions.length && !winner) {
                    winner = updatedTeam;
                    playSound('win');
                }

                await window.fbUtils.setDoc(roomDocRef, {
                    activeQuestion: {
                        ...activeQuestion,
                        teamsList: newTeamsList,
                        winningTeam: winner
                    }
                }, { merge: true });

                if (isCorrect) {
                    showToast("答對了！繼續下一題！🎉", "success");
                } else {
                    showToast("答錯了！倒扣歸零重頭開始！⚡", "error");
                }
            };

            return (
                <div class="min-h-screen bg-slate-100 flex flex-col">
                    {/* Header */}
                    <header class="bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-30 shadow-sm flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="bg-indigo-600 text-white font-black px-2.5 py-1 rounded-xl text-sm">OMIT</span>
                            <span class="font-bold text-slate-800 text-sm">
                                {seatNumber}號 - {studentName || `學號 ${seatNumber}`}
                            </span>
                        </div>
                        <button onClick={onExit} class="text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-xl">
                            離開課室
                        </button>
                    </header>

                    {/* Main Content Area */}
                    <main class="flex-1 max-w-3xl w-full mx-auto p-4 flex flex-col justify-center">

                        {/* Item 21 & 32: Broadcast Teacher Demo Whiteboard */}
                        {activeQuestion?.teacherDemoBroadcast && (
                            <div class="bg-white p-4 rounded-3xl border-4 border-purple-400 shadow-2xl space-y-3 my-4">
                                <div class="flex items-center justify-between text-purple-900 font-black text-sm">
                                    <span>🎨 正在觀看教師白板實時示範</span>
                                    <span class="animate-pulse text-xs bg-purple-100 px-2 py-0.5 rounded-full">廣播中</span>
                                </div>
                                <div class="aspect-16-9 bg-slate-50 rounded-2xl overflow-hidden border">
                                    <img src={activeQuestion.teacherDemoBroadcast} class="w-full h-full object-contain" alt="教師示範" />
                                </div>
                            </div>
                        )}

                        {/* Item 2 & 26: Broadcast Peer Review Student Work */}
                        {activeQuestion?.broadcastStudentAnswer && (
                            <div class="bg-white p-4 rounded-3xl border-4 border-indigo-400 shadow-2xl space-y-3 my-4">
                                <div class="flex items-center justify-between text-indigo-900 font-black text-sm">
                                    <span>📢 全班同學作品互評：{activeQuestion.broadcastStudentAnswer.seatNumber}號 {activeQuestion.broadcastStudentAnswer.name}</span>
                                    <span class="animate-pulse text-xs bg-indigo-100 px-2 py-0.5 rounded-full">廣播中</span>
                                </div>
                                <div class="aspect-16-9 bg-slate-50 rounded-2xl overflow-hidden border">
                                    {typeof activeQuestion.broadcastStudentAnswer.answer === 'string' && activeQuestion.broadcastStudentAnswer.answer.startsWith('data:image') ? (
                                        <img src={activeQuestion.broadcastStudentAnswer.answer} class="w-full h-full object-contain" alt="學生作品" />
                                    ) : (
                                        <div class="p-6 text-xl font-bold text-slate-800 text-center">
                                            {activeQuestion.broadcastStudentAnswer.answer}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {!activeQuestion ? (
                            <div class="text-center py-16 bg-white rounded-3xl shadow-sm border border-slate-200 space-y-4 p-8">
                                <div class="text-5xl animate-bounce">⏳</div>
                                <h2 class="text-2xl font-black text-slate-800">安靜等候老師指示...</h2>
                                <p class="text-slate-400 text-sm font-bold">老師即將發佈題目，請保持頁面開啟。</p>
                            </div>
                        ) : activeQuestion.mode === 'TEAM' ? (
                            /* Item 22.2.3 & 22.3.4: Collaborative Team Mode in Student View */
                            <div class="bg-white rounded-3xl p-6 shadow-md border-2 border-emerald-300 space-y-6">
                                <div class="border-b pb-3">
                                    <span class="text-xs font-black text-emerald-600 uppercase tracking-widest">
                                        🤝 團隊合作比賽 [{activeQuestion.teamStage === 'GROUP' ? '分組階段' : '比賽階段'}]
                                    </span>
                                    <h2 class="text-xl font-black text-slate-800 mt-1">{activeQuestion.text}</h2>
                                </div>

                                {myTeam ? (
                                    <div class="space-y-4">
                                        <div class={`p-4 rounded-2xl ${myTeam.bgLight} border-2 ${myTeam.border} flex items-center justify-between`}>
                                            <div class="flex items-center space-x-2">
                                                <span class="text-2xl">{myTeam.emoji}</span>
                                                <span class="font-black text-slate-800 text-base">{myTeam.name}</span>
                                            </div>
                                            <span class="text-xs font-bold bg-white px-3 py-1 rounded-full border">
                                                你的組員 ({myTeam.members.length}人)
                                            </span>
                                        </div>

                                        {activeQuestion.teamStage === 'GROUP' && (
                                            <div class="text-center py-8 space-y-3 bg-emerald-50 rounded-2xl border border-emerald-200">
                                                <div class="text-xl font-black text-emerald-900">
                                                    盡快與你的組員會合!比賽即將開始! 🚀
                                                </div>
                                                <div class="text-xs font-bold text-slate-500">
                                                    組員名單：{myTeam.members.map(m => `${m.seatNumber}號 ${m.name}`).join('、')}
                                                </div>
                                            </div>
                                        )}

                                        {activeQuestion.teamStage === 'COMPETITION' && !activeQuestion.winningTeam && (
                                            <div class="space-y-4">
                                                {/* Split Question Content logic for 3+ team members */}
                                                {(() => {
                                                    const memberIdx = myTeam.members.findIndex(m => m.id === studentId);
                                                    const currentQIdx = myTeam.progress;
                                                    const qObj = activeQuestion.teamData.questions[currentQIdx];

                                                    if (!qObj) return null;

                                                    // Division of responsibilities based on member index
                                                    const totalMembers = myTeam.members.length;
                                                    const roleType = memberIdx % totalMembers; // 0: Question Prompt, 1: Options A&B, 2: Options C&D, etc.

                                                    return (
                                                        <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-4 shadow-sm">
                                                            <div class="flex justify-between items-center text-xs font-bold text-slate-500">
                                                                <span>第 {currentQIdx + 1} / {activeQuestion.teamData.questions.length} 題</span>
                                                                <span class="text-emerald-600 font-extrabold">與組員合作分工中！</span>
                                                            </div>

                                                            {/* Member 1 / Role 0 sees question prompt */}
                                                            {roleType === 0 ? (
                                                                <div class="space-y-3 bg-amber-50 p-4 rounded-xl border border-amber-200">
                                                                    <div class="text-xs font-black text-amber-800">你是【題目讀題員】：請朗讀題目給組員聽！</div>
                                                                    <div class="text-lg font-black text-slate-800">{qObj.text}</div>
                                                                </div>
                                                            ) : (
                                                                <div class="space-y-3 bg-blue-50 p-4 rounded-xl border border-blue-200">
                                                                    <div class="text-xs font-black text-blue-800">你是【選項答題員】：請與組員商討答案！</div>
                                                                    <div class="grid grid-cols-2 gap-2.5">
                                                                        {qObj.options.map((opt) => (
                                                                            <button 
                                                                                key={opt.letter}
                                                                                onClick={() => handleTeamAnswerClick(opt.letter)}
                                                                                class="p-3 bg-white hover:bg-emerald-50 text-slate-800 font-bold rounded-xl border-2 hover:border-emerald-500 text-left transition shadow-sm"
                                                                            >
                                                                                <span class="font-black text-emerald-600 mr-1">{opt.letter}.</span> {opt.text}
                                                                            </button>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })()}
                                            </div>
                                        )}

                                        {/* Item 22.3.5 & 24: Winning Banner & Paper Detail Breakdown */}
                                        {activeQuestion.winningTeam && (
                                            <div class="space-y-6">
                                                <div class="bg-amber-100 border-4 border-amber-400 p-6 rounded-3xl text-center space-y-3 shadow-xl">
                                                    <div class="text-4xl">🏆</div>
                                                    <h3 class="text-2xl font-black text-amber-900">
                                                        勝出組別：{activeQuestion.winningTeam.emoji} {activeQuestion.winningTeam.name}！
                                                    </h3>
                                                    <div class="text-xs font-bold text-amber-800">
                                                        組員：{activeQuestion.winningTeam.members.map(m => `${m.seatNumber}號 ${m.name}`).join('、')}
                                                    </div>
                                                </div>

                                                {/* Downward Full Test Review */}
                                                <div class="space-y-3 border-t pt-4">
                                                    <h4 class="font-black text-slate-800 text-sm">整份考卷題目詳情與正確答案：</h4>
                                                    {activeQuestion.teamData?.questions.map((q, idx) => (
                                                        <div key={idx} class="bg-white p-4 rounded-2xl border space-y-2 text-xs">
                                                            <div class="font-bold text-slate-800">
                                                                第 {idx + 1} 題：{q.text}
                                                            </div>
                                                            <div class="grid grid-cols-2 gap-2 pl-2">
                                                                {q.options.map(opt => (
                                                                    <div 
                                                                        key={opt.letter}
                                                                        class={`p-2 rounded-lg border font-bold ${
                                                                            opt.letter === q.answer 
                                                                            ? 'bg-emerald-100 text-emerald-900 border-emerald-400 font-black' 
                                                                            : 'bg-slate-50 text-slate-600'
                                                                        }`}
                                                                    >
                                                                        {opt.letter}. {opt.text} {opt.letter === q.answer ? '✅ (正確答案)' : ''}
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div class="text-center py-6 text-slate-400 font-bold">未分配至組別，請等候老師重新分組。</div>
                                )}
                            </div>
                        ) : (
                            /* Standard Questions / Whiteboard / Challenge Interface */
                            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-6">
                                <div class="border-b pb-3 flex justify-between items-center">
                                    <div>
                                        <span class="text-xs font-black text-indigo-600 uppercase tracking-widest">
                                            [{getModeLabel(activeQuestion.mode)}]
                                        </span>
                                        <h2 class="text-xl font-black text-slate-800 mt-1">{activeQuestion.text}</h2>
                                    </div>

                                    {/* Item 13 & 19: Challenge Timer Display */}
                                    {activeQuestion.mode === 'CHALLENGE' && challengeRemainingTime !== null && !submitted && (
                                        <div class="font-mono text-sm font-black px-3 py-1.5 bg-amber-100 text-amber-900 rounded-xl border border-amber-300 animate-pulse">
                                            倒數：{Math.floor(challengeRemainingTime / 60)}:{(challengeRemainingTime % 60).toString().padStart(2, '0')}
                                        </div>
                                    )}
                                </div>

                                {/* Item 6: Unified Feedback Banner */}
                                {submitted ? (
                                    <div class="bg-emerald-50 border-2 border-emerald-300 p-6 rounded-3xl text-center space-y-3">
                                        <div class="text-4xl">🎉</div>
                                        <h3 class="text-xl font-black text-emerald-800">已提交答案! 讚賞你的努力!</h3>
                                        <p class="text-xs font-bold text-emerald-600">安靜等候老師指示...</p>

                                        {/* Item 15 & 19 & 28: Challenge Question Score & Answer Review */}
                                        {activeQuestion.mode === 'CHALLENGE' && (
                                            <div class="pt-4 border-t border-emerald-200 text-left space-y-4">
                                                {activeQuestion.challenge?.scoresReleased ? (
                                                    <div class="space-y-4">
                                                        <div class="bg-amber-100 p-4 rounded-2xl border border-amber-300 text-center font-black text-amber-900 text-lg">
                                                            總分數：{myPrevResponse?.scoreDetails?.totalScore || 0} / {activeQuestion.challenge.totalScore} 分 ({myPrevResponse?.scoreDetails?.percentage}%)
                                                        </div>

                                                        <div class="space-y-3">
                                                            <h4 class="font-black text-slate-800 text-sm">考卷詳情與批改結果：</h4>
                                                            {activeQuestion.challenge.questions.map((q, qIdx) => {
                                                                const myAns = myPrevResponse?.scoreDetails?.answers[qIdx];
                                                                const isCorrect = myAns === q.answer;

                                                                return (
                                                                    <div key={qIdx} class="bg-white p-4 rounded-2xl border space-y-2 text-xs shadow-sm">
                                                                        <div class="font-bold text-slate-800">
                                                                            第 {q.num || qIdx + 1} 題：{q.text}
                                                                        </div>
                                                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                                            {q.options.map(opt => {
                                                                                const isMyChoice = myAns === opt.letter;
                                                                                const isRightOpt = q.answer === opt.letter;

                                                                                let boxStyle = 'bg-slate-50 text-slate-600 border-slate-200';
                                                                                if (isRightOpt) {
                                                                                    boxStyle = 'bg-emerald-100 text-emerald-900 border-emerald-400 font-black';
                                                                                } else if (isMyChoice && !isCorrect) {
                                                                                    boxStyle = 'bg-rose-100 text-rose-900 border-rose-400 font-bold';
                                                                                }

                                                                                return (
                                                                                    <div key={opt.letter} class={`p-2 rounded-xl border ${boxStyle} flex justify-between`}>
                                                                                        <span>{opt.letter}. {opt.text}</span>
                                                                                        <span>
                                                                                            {isRightOpt && '✅ 正確'}
                                                                                            {isMyChoice && !isCorrect && '❌ 你的選擇'}
                                                                                        </span>
                                                                                    </div>
                                                                                );
                                                                            })}
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div class="text-center text-xs font-bold text-slate-400 py-2">
                                                        待所有學生完成提交後，由教師一併發放分數及答案解析。
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    /* Active Answering Form */
                                    <div class="space-y-5">
                                        {/* Choice / TF Question */}
                                        {(activeQuestion.mode === 'CHOICE' || activeQuestion.mode === 'TF') && (
                                            <div class="space-y-4">
                                                <div class="grid grid-cols-2 gap-3">
                                                    {activeQuestion.choiceOptions.map((opt) => (
                                                        <button 
                                                            key={opt}
                                                            onClick={() => setMyAnswer(opt)}
                                                            class={`p-4 rounded-2xl font-black text-lg border-2 transition shadow-sm active:scale-98 ${
                                                                myAnswer === opt 
                                                                ? 'bg-indigo-600 text-white border-indigo-600 ring-4 ring-indigo-200' 
                                                                : 'bg-slate-50 text-slate-800 border-slate-200 hover:border-indigo-300'
                                                            }`}
                                                        >
                                                            {opt}
                                                        </button>
                                                    ))}
                                                </div>
                                                {/* Item 3: Confirm Submit Button */}
                                                <button 
                                                    onClick={() => submitResponseToFirestore(myAnswer)}
                                                    disabled={!myAnswer}
                                                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-indigo-200 text-base transition disabled:opacity-50"
                                                >
                                                    確認提交 🚀
                                                </button>
                                            </div>
                                        )}

                                        {/* Short Answer Question */}
                                        {activeQuestion.mode === 'SHORT' && (
                                            <div class="space-y-4">
                                                <textarea 
                                                    rows={4}
                                                    placeholder="請輸入您的回答內容..."
                                                    value={myAnswer}
                                                    onChange={(e) => setMyAnswer(e.target.value)}
                                                    class="w-full p-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 font-medium text-slate-800"
                                                />
                                                {/* Item 3: Confirm Submit Button */}
                                                <button 
                                                    onClick={() => submitResponseToFirestore(myAnswer)}
                                                    disabled={!myAnswer.trim()}
                                                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-indigo-200 text-base transition disabled:opacity-50"
                                                >
                                                    確認提交 🚀
                                                </button>
                                            </div>
                                        )}

                                        {/* Whiteboard Question */}
                                        {activeQuestion.mode === 'DRAW' && (
                                            <div class="space-y-4">
                                                <WhiteboardCanvas 
                                                    initialBg={activeQuestion.whiteboardBg}
                                                    onSave={(data) => setMyAnswer(data)}
                                                    strokeWidth={strokeWidth}
                                                    setStrokeWidth={setStrokeWidth}
                                                    isEraser={isEraser}
                                                    setIsEraser={setIsEraser}
                                                    currentColor={currentColor}
                                                    setCurrentColor={setCurrentColor}
                                                    onUploadBg={(img) => setStudentBg(img)}
                                                />
                                                {/* Item 1 & 3: Whiteboard Confirm Submit Button */}
                                                <button 
                                                    onClick={() => submitResponseToFirestore(myAnswer)}
                                                    disabled={!myAnswer}
                                                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-indigo-200 text-base transition disabled:opacity-50"
                                                >
                                                    確認提交白板作品 🚀
                                                </button>
                                            </div>
                                        )}

                                        {/* Buzzer Question */}
                                        {activeQuestion.mode === 'BUZZER' && (
                                            <div class="text-center py-6">
                                                <button 
                                                    onClick={() => submitResponseToFirestore('點擊搶答！')}
                                                    class="w-48 h-48 bg-rose-600 hover:bg-rose-700 text-white font-black rounded-full text-2xl shadow-2xl transition active:scale-90 ring-8 ring-rose-200 animate-pulse"
                                                >
                                                    🚨 按我搶答！
                                                </button>
                                            </div>
                                        )}

                                        {/* Audio Recording Question */}
                                        {activeQuestion.mode === 'AUDIO' && (
                                            <div class="space-y-4 text-center">
                                                {!audioBlobUrl ? (
                                                    <button 
                                                        onClick={isRecording ? stopAudioRecording : startAudioRecording}
                                                        class={`w-full py-6 rounded-2xl font-black text-lg transition shadow-lg ${
                                                            isRecording ? 'bg-rose-600 text-white animate-pulse' : 'bg-cyan-600 hover:bg-cyan-700 text-white'
                                                        }`}
                                                    >
                                                        {isRecording ? '⏹️ 停止錄音' : '🎤 開始錄音 (最多10秒)'}
                                                    </button>
                                                ) : (
                                                    /* Item 5: Audio playback preview & confirm submit */
                                                    <div class="bg-cyan-50 p-6 rounded-2xl space-y-4 border border-cyan-200">
                                                        <audio src={audioBlobUrl} controls class="w-full" />
                                                        <div class="flex space-x-3">
                                                            <button 
                                                                onClick={() => setAudioBlobUrl(null)}
                                                                class="w-1/2 py-3 bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold rounded-xl text-sm"
                                                            >
                                                                🗑️ 刪除重錄
                                                            </button>
                                                            <button 
                                                                onClick={() => submitResponseToFirestore(audioBlobUrl)}
                                                                class="w-1/2 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl text-sm shadow"
                                                            >
                                                                ✅ 確認提交錄音
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* Item 4: Link Question with YouTube embed & target=_blank button */}
                                        {activeQuestion.mode === 'LINK' && (
                                            <div class="space-y-4">
                                                {activeQuestion.youtubeEmbed ? (
                                                    <div class="aspect-16-9 w-full rounded-2xl overflow-hidden shadow-lg">
                                                        <iframe 
                                                            src={activeQuestion.youtubeEmbed} 
                                                            class="w-full h-full" 
                                                            allow="autoplay; encrypted-media" 
                                                            allowFullScreen 
                                                        />
                                                    </div>
                                                ) : null}
                                                {activeQuestion.pushedUrl && (
                                                    <a 
                                                        href={activeQuestion.pushedUrl} 
                                                        target="_blank" 
                                                        rel="noopener noreferrer"
                                                        class="block w-full bg-amber-500 hover:bg-amber-600 text-white text-center font-black py-4 rounded-2xl shadow-lg text-base transition"
                                                    >
                                                        開啟連結網站 ↗
                                                    </a>
                                                )}
                                            </div>
                                        )}

                                        {/* Challenge Mode Question Form */}
                                        {activeQuestion.mode === 'CHALLENGE' && activeQuestion.challenge && (
                                            <div class="space-y-6">
                                                <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
                                                    {activeQuestion.challenge.questions.map((q, idx) => (
                                                        <div key={idx} class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                                                            <div class="font-bold text-slate-800 text-sm">
                                                                {q.num || idx + 1}. {q.text}
                                                            </div>
                                                            <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                                {q.options.map(opt => (
                                                                    <button 
                                                                        key={opt.letter}
                                                                        onClick={() => setChallengeAnswers({ ...challengeAnswers, [idx]: opt.letter })}
                                                                        class={`p-3 rounded-xl border text-left font-bold text-xs transition ${
                                                                            challengeAnswers[idx] === opt.letter 
                                                                            ? 'bg-amber-500 text-white border-amber-600 shadow' 
                                                                            : 'bg-white text-slate-700 hover:bg-amber-50'
                                                                        }`}
                                                                    >
                                                                        <span class="font-black mr-1">{opt.letter}.</span> {opt.text}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>

                                                <button 
                                                    onClick={handleManualSubmitChallenge}
                                                    class="w-full bg-amber-600 hover:bg-amber-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-amber-200 text-base transition"
                                                >
                                                    完成並提交整份評估 🚀
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OMITApp />);
    </script>
</body>
</html>
