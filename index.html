        // Web Audio Synthesizer
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                if (type === 'buzzer') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'win') {
                    if (window.confetti) window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } else if (type === 'alarm') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(900, ctx.currentTime);
                    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-indigo-600';

            return (

                </div>
            );
        };

        // Item 4: YouTube Embed Link Translator
        const extractYouTubeEmbed = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : null;
        };

        // Item 12: Generate Sample Word .docx Blob
        const createWordDocxBlob = async (textLines) => {
            if (!window.JSZip) throw new Error("JSZip not loaded");
            const zip = new JSZip();

            zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file("word/_rels/document.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`);

            const escapeXml = (str) => String(str).replace(/[<>&'"]/g, (c) => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });

            const paragraphsXml = textLines.map(line => `<w:p><w:r><w:t>${escapeXml(line)}</w:t></w:r></w:p>`).join('\n');

            zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${paragraphsXml}
  </w:body>
</w:document>`);

            return await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
        };

        const parseWordChallengeText = (rawText) => {
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
            let title = '地球生病了';
            let totalScore = 100;
            const questions = [];
            let currentQ = null;

            lines.forEach((line) => {
                if (/^(標題|Title)[：:]/i.test(line)) {
                    title = line.replace(/^(標題|Title)[：:]/i, '').trim();
                    return;
                }
                if (/^(總分|Total)[：:]/i.test(line)) {
                    const scoreStr = line.replace(/^(總分|Total)[：:]/i, '').replace(/分/g, '').trim();
                    totalScore = parseInt(scoreStr) || 100;
                    return;
                }

                const qMatch = line.match(/^([0-9]+)[\.、\:]\s*(.+)/);
                if (qMatch) {
                    if (currentQ && currentQ.options.length > 0) questions.push(currentQ);
                    currentQ = {
                        num: parseInt(qMatch[1]),
                        text: qMatch[2].trim(),
                        options: [],
                        answer: 'A'
                    };
                    return;
                }

                const optMatch = line.match(/^([A-D])[\.、]\s*(.+)/i);
                if (optMatch && currentQ) {
                    const letter = optMatch[1].toUpperCase();
                    let optText = optMatch[2].trim();
                    let isCorrect = false;
                    if (line.includes('*') || optText.endsWith('*')) {
                        isCorrect = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }
                    currentQ.options.push({ letter, text: optText });
                    if (isCorrect) currentQ.answer = letter;
                }
            });

            if (currentQ && currentQ.options.length > 0) questions.push(currentQ);

            if (questions.length === 0) {
                return {
                    title: title || "地球生病了",
                    totalScore: 100,
                    questions: [
                        { num: 1, text: "以下哪一項不是地球的天然資源?", options: [{ letter: "A", text: "水資源" }, { letter: "B", text: "植物資源" }, { letter: "C", text: "動物資源" }, { letter: "D", text: "機械資源" }], answer: "D" },
                        { num: 2, text: "芝士的原料屬於哪一項地球的天然資源?", options: [{ letter: "A", text: "水資源" }, { letter: "B", text: "植物資源" }, { letter: "C", text: "動物資源" }, { letter: "D", text: "礦產資源" }], answer: "C" },
                        { num: 3, text: "人們不當使用水資源會造成甚麼後果?", options: [{ letter: "A", text: "引發極端天氣" }, { letter: "B", text: "引發水災" }, { letter: "C", text: "水土流失" }, { letter: "D", text: "影響食水供應" }], answer: "D" },
                        { num: 4, text: "人們不當使用煤和石油資源會造成甚麼後果?", options: [{ letter: "A", text: "引發極端天氣" }, { letter: "B", text: "引發水災" }, { letter: "C", text: "水土流失" }, { letter: "D", text: "影響食水供應" }], answer: "A" },
                        { num: 5, text: "人們不當使用土地資源會造成甚麼後果?", options: [{ letter: "A", text: "引發極端天氣" }, { letter: "B", text: "引發水災" }, { letter: "C", text: "產生大量二氧化碳" }, { letter: "D", text: "影響食水供應" }], answer: "B" }
                    ]
                };
            }
            return { title, totalScore, questions };
        };

        // Item 1 & 21: High-precision Interactive Canvas (1280x720 internal coordinates mapping)
        const WhiteboardCanvas = ({ initialBg, onSave, disabled, strokeWidth = 4, setStrokeWidth, isEraser, setIsEraser, currentColor, setCurrentColor, onClear, onUploadBg }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [bgImageObj, setBgImageObj] = useState(null);

            useEffect(() => {
                if (initialBg) {
                    const img = new Image();
                    img.onload = () => {
                        setBgImageObj(img);
                        redrawCanvas(img);
                    };
                    img.src = initialBg;
                } else {
                    setBgImageObj(null);
                    redrawCanvas(null);
                }
            }, [initialBg]);

            const redrawCanvas = (bgImg) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (bgImg) {
                    ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            };

            const getCanvasPos = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if (disabled) return;
                e.preventDefault();
                setIsDrawing(true);
                const pos = getCanvasPos(e);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                if (!isDrawing || disabled) return;
                e.preventDefault();
                const pos = getCanvasPos(e);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');

                ctx.lineWidth = strokeWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (isEraser) {
                    ctx.globalCompositeOperation = 'destination-out';
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = currentColor || '#2563eb';
                }

                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDrawing = () => {
                if (!isDrawing) return;
                setIsDrawing(false);
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.globalCompositeOperation = 'source-over';
                if (onSave) {
                    onSave(canvas.toDataURL('image/jpeg', 0.6));
                }
            };

            const handleLocalClear = () => {
                redrawCanvas(bgImageObj);
                if (onClear) onClear();
                if (onSave) {
                    const canvas = canvasRef.current;
                    onSave(canvas.toDataURL('image/jpeg', 0.6));
                }
            };

            const handleBgUploadChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const imgData = evt.target.result;
                    const img = new Image();
                    img.onload = () => {
                        setBgImageObj(img);
                        redrawCanvas(img);
                        if (onSave) {
                            setTimeout(() => {
                                onSave(canvasRef.current.toDataURL('image/jpeg', 0.6));
                            }, 100);
                        }
                    };
                    img.src = imgData;
                    if (onUploadBg) onUploadBg(imgData);
                };
                reader.readAsDataURL(file);
            };

            return (
                <div class="space-y-3">
                    <div class="canvas-container relative w-full aspect-16-9 bg-white rounded-2xl overflow-hidden border-2 border-indigo-200 shadow-inner">
                        <canvas
                            ref={canvasRef}
                            width={1280}
                            height={720}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                            class="w-full h-full cursor-crosshair touch-none"
                        />
                    </div>

                    {!disabled && (
                        <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-100 p-3 rounded-2xl border">
                            {/* Colors */}
                            <div class="flex items-center space-x-1.5 overflow-x-auto py-1">
                                <span class="text-xs font-bold text-slate-600 mr-1">顏色:</span>
                                {PRESET_COLORS.map((c) => (
                                    <button
                                        key={c.value}
                                        type="button"
                                        onClick={() => { setCurrentColor(c.value); setIsEraser(false); }}
                                        class={`w-7 h-7 rounded-full border-2 transition ${currentColor === c.value && !isEraser ? 'scale-110 border-slate-900 ring-2 ring-indigo-400' : 'border-white'}`}
                                        style={{ backgroundColor: c.value }}
                                        title={c.name}
                                    />
                                ))}
                            </div>

                            {/* Stroke Width Slider */}
                            <div class="flex items-center space-x-2">
                                <span class="text-xs font-bold text-slate-600">粗細 ({strokeWidth}px):</span>
                                <input 
                                    type="range" 
                                    min="2" 
                                    max="18" 
                                    value={strokeWidth} 
                                    onChange={(e) => setStrokeWidth(parseInt(e.target.value))}
                                    class="w-20 accent-indigo-600 cursor-pointer"
                                />
                            </div>

                            {/* Controls */}
                            <div class="flex items-center space-x-2">
                                <button
                                    type="button"
                                    onClick={() => setIsEraser(!isEraser)}
                                    class={`px-3 py-1.5 text-xs font-bold rounded-xl border transition ${isEraser ? 'bg-amber-500 text-white border-amber-600 shadow' : 'bg-white text-slate-700 border-slate-300'}`}
                                >
                                    🧽 擦膠 {isEraser ? '(開啟中)' : ''}
                                </button>
                                <button
                                    type="button"
                                    onClick={handleLocalClear}
                                    class="px-3 py-1.5 text-xs font-bold bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl border border-rose-200 transition"
                                >
                                    🗑️ 清空
                                </button>
                                <label class="px-3 py-1.5 text-xs font-bold bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl border border-indigo-200 cursor-pointer transition">
                                    🖼️ 上載背景
                                    <input type="file" accept="image/*" onChange={handleBgUploadChange} class="hidden" />
                                </label>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        function OMITApp() {
            const [role, setRole] = useState('LANDING'); // 'LANDING', 'TEACHER', 'STUDENT'
            const [roomCode, setRoomCode] = useState('');
            const [seatNumber, setSeatNumber] = useState('1');
            const [studentName, setStudentName] = useState('');
            const [teacherPassword, setTeacherPassword] = useState('');
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [toast, setToast] = useState(null);

            const [activeQuestion, setActiveQuestion] = useState(null);
            const [studentsList, setStudentsList] = useState([]);
            const [responses, setResponses] = useState({});

            if (role === 'TEACHER') {

            if (role === 'STUDENT') {

                    <StudentInterface

        function TeacherDashboard({ roomCode, activeQuestion, setActiveQuestion, responses, setResponses, studentsList, historyQuestions, setHistoryQuestions, showToast, onExit }) {
            const [selectedMode, setSelectedMode] = useState('CHOICE');
            const [questionText, setQuestionText] = useState('');
            const [choiceCount, setChoiceCount] = useState(4);
            const [lockAfterSubmit, setLockAfterSubmit] = useState(true);
            const [whiteboardBg, setWhiteboardBg] = useState(null);
            const [pushedUrl, setPushedUrl] = useState('');

            // Modals & Tools
            const [showQRModal, setShowQRModal] = useState(false);
            const [showInspectModal, setShowInspectModal] = useState(null);
            const [inspectIndex, setInspectIndex] = useState(0);
            const [barChoiceFilter, setBarChoiceFilter] = useState(null);

            // Item 21 & 32: Demo Whiteboard Fullscreen Overlay & Broadcast Mode
            const [showDemoWhiteboardModal, setShowDemoWhiteboardModal] = useState(false);
            const [demoStrokeWidth, setDemoStrokeWidth] = useState(6);
            const [demoIsEraser, setDemoIsEraser] = useState(false);
            const [demoColor, setDemoColor] = useState('#2563eb');
            const [demoCanvasData, setDemoCanvasData] = useState(null);
            const [isDemoBroadcasting, setIsDemoBroadcasting] = useState(false);

            // Item 9: Random Selector
            const [showRandomModal, setShowRandomModal] = useState(false);
            const [rangeStart, setRangeStart] = useState(1);
            const [rangeEnd, setRangeEnd] = useState(36);
            const [drawnNumbers, setDrawnNumbers] = useState([]);
            const [currentDrawn, setCurrentDrawn] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);

            // Item 10: Timer Tool
            const [showTimerModal, setShowTimerModal] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [timerZoomed, setTimerZoomed] = useState(false);
            const [customMinInput, setCustomMinInput] = useState('01');
            const [customSecInput, setCustomSecInput] = useState('00');

            // Item 12 & 13: Challenge Question Setup
            const [challengeData, setChallengeData] = useState(null);
            const [challengeEnableTimer, setChallengeEnableTimer] = useState(true);
            const [challengeTimeLimit, setChallengeTimeLimit] = useState(120);
            const [challengeReleaseInstant, setChallengeReleaseInstant] = useState(true);

            // Item 22: Collaborative Team Match Setup & Control States
            const [teamStage, setTeamStage] = useState('PREP');
            const [teamData, setTeamData] = useState(null);
            const [teamsList, setTeamsList] = useState([]);
            const [isTeamMuted, setIsTeamMuted] = useState(false);

            const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(joinUrl)}`;

            // Current question responses
            const currentQuestionResponses = useMemo(() => {
                if (!activeQuestion) return {};
                const filtered = {};
                Object.values(responses).forEach(r => {
                    if (r.questionId === activeQuestion.id) filtered[r.studentId] = r;
                });
                return filtered;
            }, [responses, activeQuestion]);

            // Response array for inspection
            const currentResponseArray = useMemo(() => {
                return Object.values(currentQuestionResponses).sort((a, b) => parseFloat(a.duration || 0) - parseFloat(b.duration || 0));
            }, [currentQuestionResponses]);

            // Timer Interval
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => {
                            if (s <= 1) {
                                setTimerActive(false);
                                playSound('alarm');
                                return 0;
                            }
                            return s - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            const publishQuestionToFirestore = async (qObj, newHistoryList) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                
                const updatePayload = { activeQuestion: qObj, updatedAt: Date.now() };
                if (newHistoryList) updatePayload.history = newHistoryList;

                await window.fbUtils.setDoc(roomDocRef, updatePayload, { merge: true });
            };

            const handleExitRoom = async () => {
                if (window.confirm("確定退出課室？將會同步清空此課室於 Firebase 的所有暫存紀錄！")) {
                    try {
                        const appId = "omit-8c173";
                        const db = window.fbDb;
                        
                        const responsesColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'responses');
                        const resSnaps = await window.fbUtils.getDocs(responsesColRef);
                        resSnaps.forEach(async (d) => await window.fbUtils.deleteDoc(d.ref));

                        const studentsColRef = window.fbUtils.collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode, 'students');
                        const stuSnaps = await window.fbUtils.getDocs(studentsColRef);
                        stuSnaps.forEach(async (d) => await window.fbUtils.deleteDoc(d.ref));

                        const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                        await window.fbUtils.deleteDoc(roomDocRef);

                        showToast("課室暫存資料已完全清空！", "info");
                    } catch (e) {
                        console.error("Cleanup error:", e);
                    }
                    onExit();
                }
            };

            // Item 12: Download Template Word file
            const handleDownloadChallengeTemplate = async () => {
                const sampleLines = [
                    "標題：地球生病了",
                    "總分: 100分",
                    "1.以下哪一項不是地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源",
                    "D. 機械資源*",
                    "",
                    "2.芝士的原料屬於哪一項地球的天然資源?",
                    "A. 水資源",
                    "B. 植物資源",
                    "C. 動物資源*",
                    "D. 礦產資源",
                    "",
                    "3.人們不當使用水資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應*",
                    "",
                    "4.人們不當使用煤和石油資源會造成甚麼後果?",
                    "A. 引發極端天氣*",
                    "B. 引發水災",
                    "C. 水土流失",
                    "D. 影響食水供應",
                    "",
                    "5.人們不當使用土地資源會造成甚麼後果?",
                    "A. 引發極端天氣",
                    "B. 引發水災*",
                    "C. 產生大量二氧化碳",
                    "D. 影響食水供應"
                ];

                try {
                    const blob = await createWordDocxBlob(sampleLines);
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = '下載評估範本Word檔.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast("已下載 Word 評估範本檔 (.docx)！", "success");
                } catch (err) {
                    showToast("無法生成 Word 範本檔，請重新整理試試。", "error");
                }
            };

            const handleWordFileUpload = (e, targetType = 'CHALLENGE') => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        let parsedData = null;
                        if (file.name.endsWith('.docx')) {
                            const arrayBuffer = evt.target.result;
                            const result = await window.mammoth.extractRawText({ arrayBuffer });
                            parsedData = parseWordChallengeText(result.value);
                        } else {
                            parsedData = parseWordChallengeText(evt.target.result);
                        }

                        if (targetType === 'TEAM') {
                            setTeamData(parsedData);
                        } else {
                            setChallengeData(parsedData);
                        }
                        showToast(`已成功解析 Word 範本檔案！共 ${parsedData.questions.length} 題`, 'success');
                    } catch (err) {
                        showToast("文件解析失敗，請確認格式！", "error");
                    }
                };

                if (file.name.endsWith('.docx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    reader.readAsText(file, "UTF-8");
                }
            };

            // Item 22 & 23: Team Matching Engine
            const generateRandomTeams = (students) => {
                if (!students || students.length === 0) return [];
                const shuffled = [...students].sort(() => Math.random() - 0.5);
                const teamCount = Math.max(1, Math.floor(shuffled.length / 3));
                
                const shuffledThemes = [...ANIMAL_TEAMS].sort(() => Math.random() - 0.5);
                const generated = [];

                for (let i = 0; i < teamCount; i++) {
                    const theme = shuffledThemes[i % shuffledThemes.length];
                    generated.push({
                        id: 'team_' + i,
                        name: theme.name,
                        emoji: theme.emoji,
                        color: theme.color,
                        border: theme.border,
                        bgLight: theme.bgLight,
                        members: [],
                        progress: 0
                    });
                }

                shuffled.forEach((stu, idx) => {
                    const teamIdx = idx % teamCount;
                    generated[teamIdx].members.push(stu);
                });

                return generated;
            };

            const handleStartTeamGrouping = () => {
                if (!teamData || !teamData.questions || teamData.questions.length === 0) {
                    showToast("請先上載並解析 Word 評估範本檔案！", "error");
                    return;
                }
                if (studentsList.length < 3) {
                    showToast("班級人數需要最少 3 人才能進行合作分組比賽！", "error");
                    return;
                }

                const generated = generateRandomTeams(studentsList);
                setTeamsList(generated);
                setTeamStage('GROUP');

                const teamQ = {
                    id: 'q_' + Date.now(),
                    mode: 'TEAM',
                    text: `🤝 合作題比賽：${teamData.title}`,
                    startTime: Date.now(),
                    teamStage: 'GROUP',
                    teamData: teamData,
                    teamsList: generated,
                    winningTeam: null
                };
                publishQuestionToFirestore(teamQ);
                showToast("已完成隨機分組並發送給學生！", "success");
            };

            const handleRegroupTeams = () => {
                const generated = generateRandomTeams(studentsList);
                setTeamsList(generated);
                const teamQ = {
                    ...activeQuestion,
                    teamStage: 'GROUP',
                    teamsList: generated,
                    winningTeam: null
                };
                publishQuestionToFirestore(teamQ);
                showToast("已重新隨機分配組別！", "info");
            };

            const handleStartTeamCompetition = () => {
                setTeamStage('COMPETITION');
                const teamQ = {
                    ...activeQuestion,
                    teamStage: 'COMPETITION',
                    winningTeam: null
                };
                publishQuestionToFirestore(teamQ);
                showToast("合作比賽正式開始！🔥", "success");
            };

            // Item 21 & 32: Demo Whiteboard Broadcast Handler
            const toggleDemoBroadcast = async () => {
                const nextBroadcast = !isDemoBroadcasting;
                setIsDemoBroadcasting(nextBroadcast);

                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                const updatedQ = {
                    ...(activeQuestion || { id: 'q_demo_' + Date.now(), mode: 'DRAW', text: '教師白板示範' }),
                    teacherDemoBroadcast: nextBroadcast ? demoCanvasData : null
                };

                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast(nextBroadcast ? "已廣播教師示範白板至全班螢幕！" : "已收回廣播！", nextBroadcast ? "success" : "info");
            };

            // Item 2, 26, 33: Student answer broadcast handler
            const handleBroadcastStudentAnswer = async (resObj) => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                const updatedQ = {
                    ...activeQuestion,
                    broadcastStudentAnswer: resObj
                };

                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast(`已一鍵廣播 ${resObj.seatNumber}號 ${resObj.name} 的作品至全班螢幕！`, "success");
            };

            const handleCancelStudentBroadcast = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

                const updatedQ = {
                    ...activeQuestion,
                    broadcastStudentAnswer: null
                };

                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: updatedQ }, { merge: true });
                showToast("已取消作品廣播！", "info");
            };

            const handlePublishQuestion = () => {
                const promptText = questionText.trim() || getDefaultQuestionPrompt(selectedMode);
                let challengeContent = null;

                if (selectedMode === 'CHALLENGE') {
                    if (!challengeData || !challengeData.questions || challengeData.questions.length === 0) {
                        showToast("請先上載並解析 Word 評估範本檔案！", "error");
                        return;
                    }
                    challengeContent = {
                        title: challengeData.title,
                        totalScore: challengeData.totalScore,
                        questions: challengeData.questions,
                        enableTimer: challengeEnableTimer,
                        timeLimit: challengeEnableTimer ? challengeTimeLimit : null,
                        releaseInstant: challengeReleaseInstant,
                        scoresReleased: challengeReleaseInstant
                    };
                }

                const newQ = {
                    id: 'q_' + Date.now(),
                    mode: selectedMode,
                    text: selectedMode === 'CHALLENGE' ? `🏆 挑戰題：${challengeData.title}` : promptText,
                    startTime: Date.now(),
                    lockAfterSubmit: lockAfterSubmit,
                    whiteboardBg: selectedMode === 'DRAW' ? whiteboardBg : null,
                    pushedUrl: selectedMode === 'LINK' ? pushedUrl : null,
                    youtubeEmbed: selectedMode === 'LINK' ? extractYouTubeEmbed(pushedUrl) : null,
                    choiceOptions: selectedMode === 'CHOICE' ? (choiceCount === 4 ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E']) : 
                                   selectedMode === 'TF' ? ['正確 (O)', '錯誤 (X)'] : [],
                    challenge: challengeContent
                };

                const updatedHistory = [...historyQuestions, newQ];
                setHistoryQuestions(updatedHistory);

                publishQuestionToFirestore(newQ, updatedHistory);
                showToast(`已成功發佈【${getModeLabel(selectedMode)}】給所有學生！`, 'success');
            };

            const handleReleaseChallengeScores = async () => {
                if (!activeQuestion || activeQuestion.mode !== 'CHALLENGE') return;
                const updatedQ = {
                    ...activeQuestion,
                    challenge: {
                        ...activeQuestion.challenge,
                        scoresReleased: true
                    }
                };
                await publishQuestionToFirestore(updatedQ);
                showToast("已成功向所有學生一併發放挑戰題成績！", "success");
            };

            // Item 34: 收回題目功能
            const handleClearQuestion = async () => {
                const appId = "omit-8c173";
                const db = window.fbDb;
                const roomDocRef = window.fbUtils.doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
                await window.fbUtils.setDoc(roomDocRef, { activeQuestion: null }, { merge: true });
                setIsDemoBroadcasting(false);
                showToast('已收回題目，所有學生已返回待機狀態！', 'info');
            };

            // Item 20 & 30: CSV Export
            const handleExportCSVReport = () => {
                if (studentsList.length === 0) {
                    showToast("目前尚無學生紀錄可供匯出！", "error");
                    return;
                }

                let csvContent = "\uFEFF學號,學生姓名,加入時間";

                historyQuestions.forEach((q, idx) => {
                    const cleanText = (q.text || getModeLabel(q.mode)).replace(/"/g, '""');
                    if (q.mode === 'CHALLENGE' && q.challenge) {
                        csvContent += `,第${idx + 1}題[挑戰題:${q.challenge.title}得分],第${idx + 1}題[挑戰題正確率]`;
                    } else {
                        csvContent += `,第${idx + 1}題[${getModeLabel(q.mode)}]: "${cleanText}"`;
                    }
                });
                csvContent += "\n";

                const sortedStudents = [...studentsList].sort((a, b) => parseInt(a.seatNumber) - parseInt(b.seatNumber));

                sortedStudents.forEach((stu) => {
                    const cleanName = (stu.name || '').replace(/"/g, '""');
                    csvContent += `"${stu.seatNumber}號","${cleanName}","${stu.joinTime || ''}"`;
                    
                    historyQuestions.forEach((q) => {
                        const resKey = `${q.id}_${stu.id}`;
                        const res = responses[resKey];
                        
                        if (res && res.answer !== undefined && res.answer !== null) {
                            if (q.mode === 'CHALLENGE' && res.scoreDetails) {
                                csvContent += `,"${res.scoreDetails.totalScore} / ${q.challenge.totalScore}分","${res.scoreDetails.percentage}% (用時:${res.duration || 0}s)"`;
                            } else {
                                let ansVal = res.answer;
                                if (typeof ansVal === 'string' && ansVal.startsWith('data:image')) ansVal = '[圖像白板答案]';
                                else if (typeof ansVal === 'string' && ansVal.startsWith('data:audio')) ansVal = '[語音錄音檔案]';
                                const cleanAns = String(ansVal).replace(/"/g, '""');
                                csvContent += `,"${cleanAns} (用時:${res.duration || 0}s)"`;
                            }
                        } else {
                            csvContent += q.mode === 'CHALLENGE' ? `,"未作答","0%"` : `,"未作答"`;
                        }
                    });
                    csvContent += "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `OMIT_本次挑戰題與學習成績試算表_房號${roomCode}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已成功下載包含全班成績及細項答案的 CSV 試算表！", "success");
            };

            // Leaderboard sort (Item 7, 18, 31)

                const resList = Object.values(currentQuestionResponses).filter(r => r.duration !== undefined);
                
                if (activeQuestion?.mode === 'BUZZER') {

                    return resList.sort((a, b) => parseFloat(a.duration) - parseFloat(b.duration)).slice(0, 1);
                }

                return resList.sort((a, b) => {
                    if (activeQuestion?.mode === 'CHALLENGE') {
                        const scoreA = a.scoreDetails?.totalScore || 0;
                        const scoreB = b.scoreDetails?.totalScore || 0;
                        if (scoreB !== scoreA) return scoreB - scoreA;
                    }
                    return parseFloat(a.duration) - parseFloat(b.duration);
                });
            }, [currentQuestionResponses, activeQuestion]);

            // Item 9: Spin logic
            const handleSpinRandomStudent = () => {
                if (isSpinning) return;
                setIsSpinning(true);
                let count = 0;
                const maxSpins = 20;

                const available = Array.from(
                    { length: (rangeEnd - rangeStart + 1) }, 
                    (_, i) => rangeStart + i
                ).filter(num => !drawnNumbers.includes(num));

                if (available.length === 0) {
                    showToast("設定範圍內所有號碼均已抽過，自動重置抽籤盤！", "info");
                    setDrawnNumbers([]);
                }

                const pool = available.length > 0 ? available : Array.from({ length: (rangeEnd - rangeStart + 1) }, (_, i) => rangeStart + i);

                const interval = setInterval(() => {
                    const temp = pool[Math.floor(Math.random() * pool.length)];
                    setCurrentDrawn(temp);
                    playSound('spin');
                    count++;

                    if (count >= maxSpins) {
                        clearInterval(interval);
                        const finalNum = pool[Math.floor(Math.random() * pool.length)];
                        setCurrentDrawn(finalNum);
                        setDrawnNumbers(prev => [...prev, finalNum]);
                        setIsSpinning(false);
                        playSound('win');
                    }
                }, 100);
            };

            const handleApplyCustomTimer = () => {

                    {/* Item 21 & 32: Demo Whiteboard Fullscreen Modal */}
                    {showDemoWhiteboardModal && (
                        <div class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex flex-col p-4">
                            <div class="bg-white rounded-3xl p-4 flex-1 flex flex-col space-y-3 shadow-2xl overflow-hidden max-w-6xl mx-auto w-full">
                                <div class="flex justify-between items-center border-b pb-2">

                                    </button>

                        </div>

                    {/* Item 9: Random Picker Modal */}
                    {showRandomModal && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-md w-full space-y-5 shadow-2xl text-center relative">
                                <button onClick={() => setShowRandomModal(false)} class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>

                                <div class="flex items-center justify-center space-x-2 text-xs font-bold text-slate-600 bg-slate-100 p-2 rounded-xl">
                                    <span>學號範圍：</span>
                                    <input 
                                        type="number"

                                    {currentDrawn !== null ? (
                                        <div class="text-6xl font-black text-purple-700 animate-pulse font-mono">

                                <button 
                                    onClick={handleSpinRandomStudent}
                                    disabled={isSpinning}
                                    class="w-full bg-purple-600 hover:bg-purple-700 text-white font-black py-3.5 rounded-2xl shadow-lg transition active:scale-98 text-base disabled:opacity-50"
                                >
                                    {isSpinning ? '🎲 滾動抽籤中...' : '🎲 開始抽選！'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Item 10: Timer Modal */}
                    {showTimerModal && (
                        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 max-w-md w-full space-y-5 shadow-2xl text-center relative">
                                <button onClick={() => setShowTimerModal(false)} class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
                                <h3 class="text-xl font-black text-slate-800">⏱️ 倒數計時器</h3>

                                <div class="py-6 bg-amber-50 rounded-3xl border-2 border-amber-200 font-mono text-5xl font-black text-amber-800 shadow-inner">
                                    {Math.floor(timerSeconds / 60).toString().padStart(2, '0')}:{(timerSeconds % 60).toString().padStart(2, '0')}
                                </div>

                                <div class="flex flex-wrap justify-center gap-2">
                                    {[30, 60, 120, 180, 240, 300].map(s => (
                                        <button

                                            class="px-3 py-1.5 bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-xs rounded-xl border border-amber-300"

                                <div class="flex items-center justify-center space-x-2 border-t pt-3">
                                    <span class="text-xs font-bold text-slate-600">手動輸入 (分:秒)：</span>
                                    <input

                                    />
                                    <span class="font-bold">:</span>

                                        type="number"

                                        value={customSecInput}
                                        onChange={(e) => setCustomSecInput(e.target.value)}
                                        class="w-12 text-center border rounded py-1 font-mono text-xs font-bold"

                                    <button

                                        class="px-3 py-1 bg-amber-600 text-white font-bold text-xs rounded-lg"
